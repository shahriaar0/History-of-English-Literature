      background-color: #f7f8fa;
      color: #18202c;
    }

        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /**
     * ============================================================================
     * APPLICATION STATE & NAVIGATION ROUTING
     * ============================================================================
     */
    const state = {
      view: 'macro', // 'macro' | 'era' | 'author'
      selectedEraId: null,
      selectedAuthorId: null,
      eraSectionFilter: 'all' // 'all' | 'context' | 'suberas' | 'authors'
    };

    function getStageById(stageId) {
      return LINGUISTIC_STAGES.find(s => s.id === stageId);
    }

    function getEraById(eraId) {
      return ERAS_DATA.find(e => e.id === eraId);
    }

    function getAuthorById(authorId) {
      return AUTHORS_DB[authorId];
    }

    function navigateToMacro() {
      state.view = 'macro';
      state.selectedEraId = null;
      state.selectedAuthorId = null;
      state.eraSectionFilter = 'all';
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function navigateToEra(eraId, sectionFilter = 'all') {
      if (!getEraById(eraId)) return;
      state.view = 'era';
      state.selectedEraId = eraId;
      state.selectedAuthorId = null;
      state.eraSectionFilter = sectionFilter;
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function navigateToCurrentEra() {
      if (state.selectedEraId) {
        navigateToEra(state.selectedEraId, 'all');
      }
    }

    function navigateToAuthor(authorId) {
      const author = getAuthorById(authorId);
      if (!author) return;
      state.view = 'author';
      state.selectedEraId = author.eraId;
      state.selectedAuthorId = authorId;
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function handleQuickEraJump(eraId) {
      if (!eraId) return;
      navigateToEra(eraId, 'all');
    }

    function setEraSectionFilter(filter) {
      state.eraSectionFilter = filter;
      render();
    }

    /**
     * ============================================================================
     * BREADCRUMB & TOP BAR SYNCHRONIZATION
     * ============================================================================
     */
    function updateBreadcrumbs() {
      const sep1 = document.getElementById('crumb-sep-1');
      const crumbEra = document.getElementById('crumb-era');
      const sep2 = document.getElementById('crumb-sep-2');
      const crumbAuthor = document.getElementById('crumb-author');
      const quickSelect = document.getElementById('quick-era-select');

      if (quickSelect) {
        quickSelect.value = state.selectedEraId || '';
      }

      if (state.view === 'macro') {
        sep1.classList.add('hidden');
        crumbEra.classList.add('hidden');
        sep2.classList.add('hidden');
        crumbAuthor.classList.add('hidden');
      } else if (state.view === 'era') {
        const era = getEraById(state.selectedEraId);
        sep1.classList.remove('hidden');
        crumbEra.classList.remove('hidden');
        crumbEra.textContent = `${era.number}: ${era.title}`;
        crumbEra.style.backgroundColor = era.tint;
        crumbEra.style.color = era.color;

    /**

     */
    function renderAuthorView() {
      const author = getAuthorById(state.selectedAuthorId);

      const siblingAuthors = era.keyFigures.map(id => getAuthorById(id)).filter(Boolean);

              <div class="mt-7 grid grid-cols-1 lg:grid-cols-2 gap-5">
                <div style="background-color: ${era.tint};" class="rounded-2xl p-5 sm:p-6 shadow-subcard">
                  <div class="text-[10.5px] font-bold uppercase tracking-[0.15em] mb-2" style="color: ${era.color};">

                  <p class="text-sm text-ink leading-relaxed">

                  <div class="mt-4 flex flex-wrap gap-1.5">

                  <div class="text-[10.5px] font-bold uppercase tracking-[0.15em] text-slate-500 mb-2">
                    Historical &amp; Biographical Situation
                  </div>
                  <p class="text-sm text-slate-700 leading-relaxed">
                    ${author.historicalSituation}
                  </p>
                </div>
              </div>
            </div>
          </section>

          <!-- Flagship Works Breakdown -->
          <section class="space-y-6">
            <div class="flex flex-wrap items-center justify-between gap-2 px-1">
              <div>
                <span class="text-[10.5px] font-bold tracking-[0.16em] uppercase" style="color: ${era.color};">
                  Flagship Creations &amp; Textual Deep-Dive
                </span>
                <h2 class="font-serif text-2xl sm:text-3xl font-bold text-ink mt-0.5">
                  Major Works, Characters &amp; Context
                </h2>
              </div>
              <span class="text-xs font-medium text-slate-500">
                ${author.works.length} Core Work${author.works.length > 1 ? 's' : ''} Analyzed
              </span>
            </div>

            <div class="space-y-6">
              ${author.works.map((work, idx) => `
                <article class="editorial-card rounded-3xl p-6 sm:p-8">
                  <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
                    <div class="flex flex-wrap items-center gap-2.5">
                      <span style="background-color: ${era.color};" class="px-3 py-1 rounded-full text-white text-xs font-bold">
                        Work 0${idx + 1}
                      </span>
                      <span style="background-color: ${era.tint}; color: ${era.color};" class="px-3 py-1 rounded-full text-xs font-semibold">

                      <span class="px-3 py-1 rounded-full bg-canvas text-xs font-medium text-slate-600 shadow-subcard">

                      <div>
                        <h4 class="text-[10.5px] font-bold uppercase tracking-[0.15em] mb-2" style="color: ${era.color};">

                        <p class="text-xs sm:text-sm text-slate-700 leading-relaxed">
                          ${work.summary}

                      </div>

                      <div class="space-y-2.5">
                        ${work.characters.map(charStr => {
                          const colonIdx = charStr.indexOf(':');

    /**
     * ============================================================================
     * MODALS FOR MILESTONES & LINGUISTIC STAGES
     * ============================================================================
     */
    function openMilestoneModal(index) {
      const m = CATALYST_MILESTONES[index];
      if (!m) return;
      const st = getStageById(m.stageId);
      const modal = document.getElementById('detail-modal');
      const content = document.getElementById('detail-modal-content');

      content.innerHTML = `
        <div class="flex items-center gap-2 mb-3">
          <span style="background-color: ${m.isPrimary ? '#fff1f2' : st.tint}; color: ${m.isPrimary ? '#be123c' : st.color};" class="px-3 py-1 rounded-full font-mono text-xs font-bold">
            ${m.year} ${m.isPrimary ? '★ Primary Turning Point' : ''}
          </span>
          <span class="px-3 py-1 rounded-full bg-canvas text-xs font-medium text-slate-600">
            ${st.name}
          </span>
        </div>
        <h3 class="font-serif text-2xl font-bold text-ink leading-snug pr-8">
          ${m.title}
        </h3>
        <p class="text-xs font-semibold uppercase tracking-wider mt-1.5" style="color: ${st.color};">
          ${m.impact}
        </p>

        <div class="mt-5 space-y-4 text-sm text-slate-700 leading-relaxed">
          <div class="bg-canvas rounded-2xl p-4 shadow-subcard">
            <div class="text-[10.5px] font-bold uppercase tracking-wider text-slate-500 mb-1">Historical Event</div>
            <p>${m.summary}</p>
          </div>
          <div style="background-color: ${st.tint};" class="rounded-2xl p-4 shadow-subcard">

    function openStageModal(stageId) {
      const st = getStageById(stageId);
      if (!st) return;
      const modal = document.getElementById('detail-modal');
      const content = document.getElementById('detail-modal-content');

      content.innerHTML = `
        <div class="flex items-center gap-2 mb-3">
          <span style="background-color: ${st.tint}; color: ${st.color};" class="px-3 py-1 rounded-full text-xs font-bold tracking-wider uppercase">
            ${st.number} · ${st.label}
          </span>
          <span class="px-3 py-1 rounded-full bg-canvas text-xs font-medium text-slate-600">
            ${st.span}
          </span>
        </div>
        <h3 class="font-serif text-2xl sm:text-3xl font-bold text-ink pr-8">
          ${st.name} <span class="italic font-normal text-lg text-slate-500">(${st.endonym})</span>
        </h3>

        <div class="mt-5 space-y-3.5 text-xs sm:text-sm text-slate-700 leading-relaxed">
          <div class="bg-canvas rounded-2xl p-4 shadow-subcard">
            <div class="text-[10px] font-bold uppercase tracking-wider text-slate-500 mb-1">Grammar &amp; Syntax</div>
            <p>${st.grammar}</p>
          </div>
          <div class="bg-canvas rounded-2xl p-4 shadow-subcard">
            <div class="text-[10px] font-bold uppercase tracking-wider text-slate-500 mb-1">Spelling &amp; Sound</div>
            <p>${st.spelling}</p>
          </div>
          <div class="bg-canvas rounded-2xl p-4 shadow-subcard">
            <div class="text-[10px] font-bold uppercase tracking-wider text-slate-500 mb-1">Lexical Sources</div>
            <p>${st.lexical}</p>
          </div>
          <div style="background-color: ${st.tint};" class="rounded-2xl p-4 shadow-subcard">
            <div class="text-[10px] font-bold uppercase tracking-wider mb-1" style="color: ${st.color};">Structural Insight</div>
            <p class="text-ink">${st.deepNote}</p>
          </div>
        </div>
      `;

      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeDetailModal() {
      const modal = document.getElementById('detail-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeDetailModal();
    });

    /**
     * ============================================================================
     * HIGH-RESOLUTION SCREENSHOT EXPORT (html2canvas)
     * ============================================================================
     */
    function showToast(message, isSuccess = true) {
      const banner = document.getElementById('toast-banner');
      const dot = document.getElementById('toast-dot');
      const msg = document.getElementById('toast-message');

      msg.textContent = message;
      dot.className = `w-2.5 h-2.5 rounded-full ${isSuccess ? 'bg-emerald-400' : 'bg-amber-400'}`;

      banner.classList.remove('opacity-0', 'translate-y-3');
      banner.classList.add('opacity-100', 'translate-y-0');

      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => {
        banner.classList.add('opacity-0', 'translate-y-3');
        banner.classList.remove('opacity-100', 'translate-y-0');
      }, 3200);
    }

    async function captureViewScreenshot() {
      const btn = document.getElementById('screenshot-btn');
      const label = document.getElementById('screenshot-label');
      const target = document.getElementById('capture-container');

      if (typeof html2canvas === 'undefined') {
        showToast('Screenshot engine is loading—please try again in a moment.', false);
        return;
      }

      try {
        btn.disabled = true;
        btn.classList.add('opacity-75');
        label.textContent = 'Rendering PNG...';
        showToast('Capturing high-resolution view...', false);

        // Build clean descriptive filename based on current view
        let filename = 'English-Literary-History-Macro-Overview.png';
        if (state.view === 'era' && state.selectedEraId) {
          const era = getEraById(state.selectedEraId);
          filename = `${era.number.replace(/\s+/g, '-')}-${era.title.replace(/[^a-zA-Z0-9]+/g, '-')}.png`;
        } else if (state.view === 'author' && state.selectedAuthorId) {
          const author = getAuthorById(state.selectedAuthorId);
          filename = `${author.name.replace(/[^a-zA-Z0-9]+/g, '-')}-Micro-Analysis.png`;
        }

        const canvas = await html2canvas(target, {
          scale: 2,
          useCORS: true,
          backgroundColor: '#f7f8fa',
          logging: false,
          windowWidth: document.documentElement.scrollWidth,
          windowHeight: target.scrollHeight
        });

        const dataUrl = canvas.toDataURL('image/png');
        const link = document.createElement('a');
        link.download = filename;
        link.href = dataUrl;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);

        showToast(`Saved ${filename}`, true);
      } catch (err) {
        console.error('Screenshot error:', err);
        showToast('Could not render screenshot. Please try again.', false);
      } finally {
        btn.disabled = false;
        btn.classList.remove('opacity-75');
        label.textContent = 'Save Screenshot';
      }
    }

    /**
     * ============================================================================
     * MAIN RENDER CONTROLLER
     * ============================================================================
     */
    function render() {
      const root = document.getElementById('app-root');
      updateBreadcrumbs();

      if (state.view === 'macro') {
        root.innerHTML = renderMacroView();
      } else if (state.view === 'era') {
        root.innerHTML = renderEraView();
      } else if (state.view === 'author') {
        root.innerHTML = renderAuthorView();
      }
    }

    // Initialize application on page load
    window.addEventListener('DOMContentLoaded', () => {
      render();
    });
  </script>
